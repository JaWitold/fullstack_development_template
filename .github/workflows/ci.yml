name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.composer-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate composer.json and composer.lock
        run: composer validate --strict
        working-directory: ./symfony

      - name: Cache Composer dependencies and vendor directory
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer
            ./symfony/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('symfony/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ vars.PHP_VERSION }}'
          extensions: mbstring, xml, ctype, iconv, intl
          tools: composer:v2

      - name: Install PHP dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress --no-scripts
        working-directory: ./symfony

  quality-control:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer
            ./symfony/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('symfony/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ vars.PHP_VERSION }}'
          extensions: mbstring, xml, ctype, iconv, intl
          tools: composer:v2

      - name: Run QC tools
        run: |
          ./vendor/bin/phpcs
          ./vendor/bin/phpstan analyze
          ./vendor/bin/php-cs-fixer fix --dry-run
        working-directory: ./symfony

  unit-tests:
    runs-on: ubuntu-latest
    needs: quality-control
    steps:
      - uses: actions/checkout@v5

      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer
            ./symfony/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('symfony/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ vars.PHP_VERSION }}'
          extensions: mbstring, xml, ctype, iconv, intl
          tools: composer:v2

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --testsuite Unit
        working-directory: ./symfony

  feature-tests:
    runs-on: ubuntu-latest
    needs: quality-control
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer
            ./symfony/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('symfony/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ vars.PHP_VERSION }}'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql
          tools: composer:v2

      - name: Run PHPUnit
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST: postgres
          #DATABASE_URL: "postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}?serverVersion=18&charset=utf8"
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:schema:create
          ./vendor/bin/phpunit --testsuite Feature
        working-directory: ./symfony
