services:
  reverse_proxy_nginx:
    image: nginx:${NGINX_VERSION}-alpine-slim
    container_name: reverse_proxy_nginx
    depends_on:
      - nginx
      - next
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/reverse_proxy_nginx/config/:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl/:/etc/nginx/ssl/nginx:ro
      - ./docker/next/ssl/:/etc/nginx/ssl/next:ro
      - ./docker/mailhog/ssl/:/etc/nginx/ssl/mailhog:ro
    networks:
      - frontend

  next:
    build:
      context: .
      dockerfile: ./docker/next/Dockerfile
      args:
        - NODE_VERSION=${NODE_VERSION}-alpine
    container_name: next
    restart: always
    volumes:
      - ./next:/var/www/next
    env_file:
      - .env
    command: "npm run dev -- -p 80"
    networks:
      - frontend

  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      args:
        - PHP_VERSION=${PHP_VERSION}-fpm-alpine
    container_name: php
    restart: always
    working_dir: /var/www/symfony
    volumes:
      - ./symfony:/var/www/symfony
    env_file:
      - .env
    networks:
      - backend

  nginx:
    image: nginx:${NGINX_VERSION}-alpine-slim
    depends_on:
      - php
    container_name: nginx
    restart: always
    volumes:
      - ./symfony:/var/www/symfony
      - ./docker/nginx/config/:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl/:/etc/nginx/ssl:ro
    networks:
      - backend
      - frontend

  postgres:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    container_name: postgres
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - backend

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: always
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_HTTP_PORT:-8025}:8025"
    networks:
      - backend
      - frontend

  cache:
    image: ${CACHE_IMAGE:-valkey/valkey}:${CACHE_VERSION}-alpine
    container_name: cache
    restart: always
    ports:
      - "${CACHE_PORT:-6379}:6379"
    networks:
      - backend

volumes:
  postgres-data:

networks:
  frontend:
  backend: